<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fast tap-based capture of live 4-card PLO preflop hands (cash & MTT).">

  <!-- Lock the viewport: this is a one-handed, at-the-table capture tool. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0C0F0E">

  <!-- iOS: full-screen "Add to Home Screen" app, dark status bar -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PLO Show HH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The PLO Show: Hand History</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Dark splash that matches the app's scaffold colour, so the screen is
       never white while Flutter boots (especially noticeable as an installed
       PWA on a cold start). Removed automatically once Flutter takes over. */
    html, body { margin: 0; padding: 0; background-color: #000; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background-color: #000;
    }
    #boot img {
      width: min(72vw, 360px); height: auto;
      animation: bootpulse 1.8s ease-in-out infinite;
    }
    @keyframes bootpulse {
      0%, 100% { opacity: 0.78; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="boot"><img src="logo.png" alt="The PLO Show — Hand History"></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Drop the boot splash once Flutter's first frame is up.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
