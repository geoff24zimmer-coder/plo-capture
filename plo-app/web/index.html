<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fast tap-based capture of live 4-card PLO preflop hands (cash & MTT).">

  <!-- Lock the viewport: this is a one-handed, at-the-table capture tool. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0C0F0E">

  <!-- iOS: full-screen "Add to Home Screen" app, dark status bar -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PLO Show HH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The PLO Show: Hand History</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Animated launch splash: a full-screen logo-reveal video, shown while
       Flutter/wasm downloads and boots, then crossfaded into the app. A minimum
       on-screen time (see the script below) lets the reveal land even when
       Flutter boots instantly from cache. Muted + playsinline so it autoplays
       on every browser (incl. iOS); the audio track is intentionally dropped. */
    html, body { margin: 0; padding: 0; background-color: #000; }
    #boot {
      position: fixed; inset: 0; background-color: #000;
      /* Stay above Flutter's view: once it boots it paints into <body> on top,
         so without this the minimum-hold would show the app, not the splash. */
      z-index: 2147483647;
      transition: opacity 0.55s ease-in-out;
    }
    #boot.hide { opacity: 0; }
    #boot video {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; /* fill the screen; crop the overflow */
      transition: opacity 0.45s ease-in, transform 0.6s ease-in;
    }
    /* Handoff dips through black: the video dissolves into #boot's black
       background (easing back slightly) before the black itself fades up to the
       landing — a clean transition instead of crossfading two different logo
       layouts (the video's centred logo vs the landing's smaller upper logo). */
    #boot.dim video { opacity: 0; transform: scale(1.04); }
    /* Reduced motion (or no video support): static logo on black instead. */
    @media (prefers-reduced-motion: reduce) {
      #boot video { display: none; }
      #boot {
        background: #000 center / min(72vw, 340px) no-repeat url(logo.png);
      }
    }
  </style>
</head>
<body>
  <div id="boot">
    <video autoplay muted playsinline>
      <source src="splash.mp4" type="video/mp4">
    </video>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Keep the splash up long enough for the logo reveal to land (~3.5s in the
    // clip), even when Flutter boots instantly from cache, then crossfade into
    // the app. If Flutter takes longer, the video plays on and holds its last
    // (settled-logo) frame until the handoff.
    (function () {
      var start = Date.now();
      var MIN_MS = 3600;
      var done = false;
      function hide() {
        if (done) return; done = true;
        var b = document.getElementById('boot');
        if (!b) return;
        b.classList.add('dim'); // video dissolves into the black background
        setTimeout(function () {
          b.classList.add('hide'); // then the black fades up to the landing
          setTimeout(function () { if (b) b.remove(); }, 580);
        }, 430);
      }
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - start)));
      });
    })();
  </script>
  <!-- In-browser MP4 export for shared replay clips (WebCodecs + vendored
       mp4-muxer). Classic scripts: they define the global `Mp4Muxer` and
       `window.ploEncodeMp4` before any user-triggered export calls them. -->
  <script src="mp4-muxer.min.js"></script>
  <script src="mp4_encoder.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
