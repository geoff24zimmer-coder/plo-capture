<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fast tap-based capture of live 4-card PLO preflop hands (cash & MTT).">

  <!-- Lock the viewport: this is a one-handed, at-the-table capture tool. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0C0F0E">

  <!-- iOS: full-screen "Add to Home Screen" app, dark status bar -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PLO Show HH">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The PLO Show: Hand History</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Animated launch splash, shown while Flutter/wasm downloads and boots,
       then crossfaded into the app. A minimum on-screen time (see the script
       below) guarantees the animation plays even when Flutter boots instantly
       from cache. Pure CSS over the transparent logo — the gold sheen is masked
       to the logo's alpha so it only shimmers across the art. */
    html, body { margin: 0; padding: 0; background-color: #000; }
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center;
      background: radial-gradient(120% 90% at 50% 44%, #0a0d0c 0%, #000 68%);
      transition: opacity 0.45s ease;
    }
    #boot.hide { opacity: 0; }

    .boot-wrap { position: relative; width: min(76vw, 360px); }

    /* Gold flash that bursts behind the logo as it lands. */
    .boot-wrap::before {
      content: ''; position: absolute; inset: -35%; z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 46%,
                  rgba(255,214,120,.55), rgba(255,196,80,0) 60%);
      opacity: 0; animation: bootflash 1.2s ease-out 0.1s 1 both;
    }
    .boot-wrap img {
      position: relative; z-index: 1; width: 100%; height: auto; display: block;
      animation: bootrise 0.7s cubic-bezier(.18,.9,.28,1.2) both,
                 bootglow 1.7s ease-in-out 0.7s infinite;
    }

    /* Gold sheen, clipped to the logo's alpha so it travels only over the art. */
    .boot-shimmer {
      position: absolute; inset: 0; z-index: 2; pointer-events: none;
      overflow: hidden;
      -webkit-mask: url(logo.png) center / 100% 100% no-repeat;
              mask: url(logo.png) center / 100% 100% no-repeat;
    }
    .boot-shimmer::after {
      content: ''; position: absolute; top: -30%; bottom: -30%; width: 46%;
      left: -70%; transform: skewX(-13deg); filter: blur(5px);
      mix-blend-mode: screen;
      background: linear-gradient(100deg, transparent,
                  rgba(255,249,225,.95), transparent);
      animation: bootsweep 1.9s ease-in-out 0.5s infinite;
    }

    .spark {
      position: absolute; z-index: 3; border-radius: 50%;
      background: #fff1c6; box-shadow: 0 0 9px 2px rgba(255,205,110,.95);
      opacity: 0;
    }
    .s1 { left: 26%; bottom: 26%; width: 4px; height: 4px; animation: bootspark 2.2s ease-in 0.9s infinite; }
    .s2 { left: 50%; bottom: 19%; width: 5px; height: 5px; animation: bootspark 2.4s ease-in 1.4s infinite; }
    .s3 { left: 72%; bottom: 27%; width: 4px; height: 4px; animation: bootspark 2.2s ease-in 1.1s infinite; }
    .s4 { left: 38%; bottom: 32%; width: 3px; height: 3px; animation: bootspark 2.6s ease-in 1.8s infinite; }
    .s5 { left: 62%; bottom: 33%; width: 3px; height: 3px; animation: bootspark 2.6s ease-in 2.1s infinite; }
    .s6 { left: 45%; bottom: 23%; width: 5px; height: 5px; animation: bootspark 2.3s ease-in 2.6s infinite; }

    @keyframes bootflash {
      0%   { opacity: 0; transform: scale(.5); }
      22%  { opacity: .95; }
      100% { opacity: 0; transform: scale(1.3); }
    }
    @keyframes bootrise {
      0%   { opacity: 0; transform: translateY(14px) scale(.5); }
      55%  { opacity: 1; transform: translateY(0) scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
    @keyframes bootglow {
      0%, 100% { filter: drop-shadow(0 0 8px rgba(225,185,80,.35)); }
      50%      { filter: drop-shadow(0 0 34px rgba(240,200,95,.8)); }
    }
    @keyframes bootsweep { 0% { left: -70%; } 50%, 100% { left: 165%; } }
    @keyframes bootspark {
      0%   { opacity: 0; transform: translateY(6px) scale(.4); }
      15%  { opacity: 1; }
      100% { opacity: 0; transform: translateY(-64px) scale(1.1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .boot-wrap img { animation: none; }
      .boot-wrap::before, .boot-shimmer, .spark { display: none; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="boot-wrap">
      <img src="logo.png" alt="The PLO Show — Hand History">
      <div class="boot-shimmer"></div>
      <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
      <span class="spark s4"></span><span class="spark s5"></span><span class="spark s6"></span>
    </div>
  </div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    // Keep the splash up long enough to actually see the launch animation, even
    // when Flutter boots instantly from cache, then crossfade into the app.
    (function () {
      var start = Date.now();
      var MIN_MS = 2000;
      var done = false;
      function hide() {
        if (done) return; done = true;
        var b = document.getElementById('boot');
        if (!b) return;
        b.classList.add('hide');
        setTimeout(function () { if (b) b.remove(); }, 480);
      }
      window.addEventListener('flutter-first-frame', function () {
        setTimeout(hide, Math.max(0, MIN_MS - (Date.now() - start)));
      });
    })();
  </script>
  <!-- In-browser MP4 export for shared replay clips (WebCodecs + vendored
       mp4-muxer). Classic scripts: they define the global `Mp4Muxer` and
       `window.ploEncodeMp4` before any user-triggered export calls them. -->
  <script src="mp4-muxer.min.js"></script>
  <script src="mp4_encoder.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
